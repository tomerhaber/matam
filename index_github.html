<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>הוצאות בנייה</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:14px 16px;font-size:22px;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#f4f7fb;position:sticky;top:51px;z-index:9}.tab,.btn{border:1px solid #d7dce3;background:#fff;border-radius:12px;padding:10px 13px;font:inherit;font-weight:700}.tab.active,.primary{background:#2563eb;color:#fff}.page{padding:0 12px 90px;max-width:1050px;margin:auto}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:13px}.muted{color:#6b7280}.big{font-size:22px;font-weight:800;margin-top:5px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.toolbar>*{flex:1;min-width:145px}.input,select,textarea{width:100%;padding:11px;border:1px solid #d7dce3;border-radius:11px;background:#fff;font:inherit}.sum{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:12px;font-weight:800;margin:10px 0}.item{margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:12px;background:#eef2f7;border-radius:999px;padding:4px 7px}.section{font-weight:800;font-size:18px;margin:18px 0 8px}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:12px;margin:10px 0}.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.warn{background:#fef2f2;border-color:#fecaca;color:#991b1b}.filterbox{position:relative}.panel{position:absolute;z-index:30;top:48px;right:0;left:0;background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;max-height:300px;overflow:auto;box-shadow:0 10px 30px #0002}.pick{display:block;width:100%;text-align:right;border:0;background:#fff;padding:9px;border-radius:8px}.pick.sel{background:#dbeafe}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:95vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:#6b7280;font-weight:700;margin-bottom:5px}.fab{position:fixed;left:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-size:32px;z-index:15}.status{font-size:12px;padding:6px 12px;background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.sheet{max-width:720px;margin:auto}}
</style></head><body><header>🏗️ הוצאות בנייה</header><div id="status" class="status">מתחבר לנתונים...</div><div class="tabs"><button class="tab active" data-p="dash">דשבורד</button><button class="tab" data-p="expenses">הוצאות</button><button class="tab" data-p="reports">דוחות</button></div><main><section id="dash" class="page"></section><section id="expenses" class="page hidden"></section><section id="reports" class="page hidden"></section></main><button class="fab" onclick="openForm()">+</button><input id="globalImport" type="file" accept=".json,application/json" hidden>
<div id="modal" class="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><h2 id="mt">הוצאה חדשה</h2><form id="form"><input id="eid" type="hidden"><div class="field"><label>תיאור</label><input id="description" class="input" required></div><div class="field"><label>סכום</label><input id="amount" class="input" type="number" step="0.01" required></div><div class="field"><label>תאריך</label><input id="date" class="input" type="date" required></div><div class="field"><label>קטגוריה</label><div class="row"><select id="categoryId"></select><button type="button" class="btn" onclick="addCat()">+ קטגוריה</button></div></div><div class="field"><label>שולם על ידי</label><div class="row"><select id="paidBy"></select><button type="button" class="btn" onclick="addPayer()">+ משלם</button></div></div><div class="field"><label>החזר למשלם</label><select id="reimbursementTo"></select></div><div class="field"><label>ספק</label><div class="row"><input id="supplier" class="input" list="suppliers"><button type="button" class="btn" onclick="addSupplier()">+ ספק</button></div><datalist id="suppliers"></datalist></div><div class="field"><label>אמצעי תשלום</label><select id="paymentMethod"><option></option><option>העברה בנקאית</option><option>כרטיס אשראי</option><option>מזומן</option><option>צ'ק</option></select></div><div class="field"><label>הערות</label><textarea id="notes" rows="3"></textarea></div><label><input id="exclude" type="checkbox"> לא לכלול בסך הוצאות הפרויקט</label><div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary" type="submit">שמור</button><button class="btn" type="button" onclick="closeForm()">ביטול</button><button id="del" class="btn danger hidden" type="button" onclick="delExp()">מחק</button></div></form></div></div>
<script>
const SB_URL='https://dpvgxjvchhegdkpfuowb.supabase.co';
const SB_KEY='sb_publishable_RTZyGacrkhvFQYkVMpKyjA_AkX5RFWo';
const STATE_ID='building-expenses',LS='hotzaot-bniya-shared-v1';
let db={expenses:[],categories:[],payers:[]},cats=[],catOpen=false,current='dash',syncTimer=null;
const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalize(){db.expenses=Array.isArray(db.expenses)?db.expenses:[];db.categories=Array.isArray(db.categories)?db.categories:[];db.payers=Array.isArray(db.payers)?db.payers:[];for(const e of db.expenses)if(e.paidBy&&!db.payers.includes(e.paidBy))db.payers.push(e.paidBy)}
function setStatus(t,ok=true){$('status').textContent=t;$('status').style.background=ok?'#dcfce7':'#fee2e2'}
async function cloudLoad(){try{const r=await fetch(`${SB_URL}/rest/v1/app_state?id=eq.${encodeURIComponent(STATE_ID)}&select=data,updated_at`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();const x=rows?.[0]?.data;if(x&&Array.isArray(x.expenses)){db=x;normalize();localStorage.setItem(LS,JSON.stringify(db));setStatus('✓ מסונכרן לענן · '+db.expenses.length+' הוצאות');render()}else throw Error('אין נתונים בענן')}catch(e){console.error(e);try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x?.expenses){db=x;normalize();setStatus('מצב לא מקוון · מציג נתונים שמורים',false);render();return}}catch{}setStatus('לא ניתן לטעון נתונים',false);render()}}
async function cloudSave(){normalize();localStorage.setItem(LS,JSON.stringify(db));setStatus('שומר לענן...');const r=await fetch(`${SB_URL}/rest/v1/app_state?id=eq.${encodeURIComponent(STATE_ID)}`,{method:'PATCH',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({data:db,updated_at:new Date().toISOString()})});if(!r.ok){setStatus('השמירה לענן נכשלה · הנתונים נשמרו במכשיר',false);throw Error('save '+r.status)}setStatus('✓ נשמר ומסונכרן לענן · '+db.expenses.length+' הוצאות')}
function save(){normalize();render();clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudSave().catch(console.error),150)}
function cmap(){return Object.fromEntries(db.categories.map(c=>[c.id,c]))}function payer(e){return e.paidBy||'לא צוין'}
function render(){renderDash();renderExpenses();renderReports();fill();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==current));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===current))}
function renderDash(){const inc=db.expenses.filter(e=>!e.excludeFromTotal),tot=inc.reduce((s,e)=>s+(+e.amount||0),0),all=db.expenses.reduce((s,e)=>s+(+e.amount||0),0),exc=all-tot,by={};inc.forEach(e=>by[payer(e)]=(by[payer(e)]||0)+(+e.amount||0));$('dash').innerHTML=`<div class="grid"><div class="card"><div class="muted">סה"כ הוצאות פרויקט</div><div class="big">${fmt.format(tot)}</div></div><div class="card"><div class="muted">כל התשלומים</div><div class="big">${fmt.format(all)}</div></div><div class="card"><div class="muted">לא בחישוב</div><div class="big">${fmt.format(exc)}</div></div><div class="card"><div class="muted">מספר הוצאות</div><div class="big">${db.expenses.length}</div></div></div><div class="section">שולם על ידי</div><div class="grid">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="card"><b>${esc(n)}</b><div class="big">${fmt.format(v)}</div></div>`).join('')}</div>`}
function renderExpenses(){let q=$('q')?.value?.toLowerCase()||'',p=$('fp')?.value||'',x=$('fx')?.value||'';let a=[...db.expenses].sort((a,b)=>new Date(b.date)-new Date(a.date));if(q)a=a.filter(e=>[e.description,e.supplier,e.notes].join(' ').toLowerCase().includes(q));if(p)a=a.filter(e=>payer(e)===p);if(cats.length)a=a.filter(e=>cats.includes(e.categoryId));if(x==='in')a=a.filter(e=>!e.excludeFromTotal);if(x==='out')a=a.filter(e=>e.excludeFromTotal);const sum=a.reduce((s,e)=>s+(+e.amount||0),0),cm=cmap();$('expenses').innerHTML=`<div class="toolbar"><input id="q" class="input" placeholder="חיפוש" value="${esc(q)}" oninput="renderExpenses()"><select id="fp" onchange="renderExpenses()"><option value="">כל המשלמים</option>${db.payers.map(n=>`<option ${n===p?'selected':''}>${esc(n)}</option>`).join('')}</select><div class="filterbox"><button class="btn" onclick="event.stopPropagation();catOpen=!catOpen;renderExpenses()">קטגוריות: ${cats.length?cats.length+' נבחרו':'הכול'} ▾</button>${catOpen?`<div class="panel" onclick="event.stopPropagation()"><button class="pick ${!cats.length?'sel':''}" onclick="cats=[];renderExpenses()">כל הקטגוריות</button>${db.categories.map(c=>`<button class="pick ${cats.includes(c.id)?'sel':''}" onclick="cats.includes('${c.id}')?cats=cats.filter(z=>z!=='${c.id}'):cats.push('${c.id}');renderExpenses()">${cats.includes(c.id)?'✓ ':''}${esc(c.name)}</button>`).join('')}<button class="btn" style="width:100%;margin-top:8px" onclick="catOpen=false;renderExpenses()">סגור</button></div>`:''}</div><select id="fx" onchange="renderExpenses()"><option value="">כל התשלומים</option><option value="in" ${x==='in'?'selected':''}>רק בחישוב</option><option value="out" ${x==='out'?'selected':''}>רק לא בחישוב</option></select><button class="btn" onclick="exportData()">Export JSON</button><label class="btn">Import JSON<input id="imp" type="file" accept=".json,application/json" hidden></label></div><div class="sum">סה"כ לפי הסינון: ${fmt.format(sum)} · ${a.length} תשלומים</div>${a.map(e=>`<div class="item" onclick="openForm('${e.id}')"><div class="row"><b>${esc(e.description||'')}</b><b>${fmt.format(+e.amount||0)}</b></div><div class="muted">${new Date(e.date).toLocaleDateString('he-IL')} · ${esc(e.supplier||'')}</div><div class="chips"><span class="chip">${esc(cm[e.categoryId]?.name||'ללא קטגוריה')}</span><span class="chip">שולם: ${esc(payer(e))}</span>${e.reimbursementTo?`<span class="chip">החזר ל: ${esc(e.reimbursementTo)}</span>`:''}${e.excludeFromTotal?'<span class="chip">לא בחישוב</span>':''}</div></div>`).join('')}`;const inp=$('imp');if(inp)inp.onchange=async ev=>{if(ev.target.files[0])await importJSON(ev.target.files[0]);ev.target.value=''}}
function renderReports(){const cm=cmap(),inc=db.expenses.filter(e=>!e.excludeFromTotal),byP={},byC={};inc.forEach(e=>{byP[payer(e)]=(byP[payer(e)]||0)+(+e.amount||0);byC[e.categoryId]=(byC[e.categoryId]||0)+(+e.amount||0)});const settle=db.payers.map(n=>{const got=db.expenses.filter(e=>e.paidBy===n).reduce((s,e)=>s+(+e.amount||0),0),ret=db.expenses.filter(e=>e.reimbursementTo===n).reduce((s,e)=>s+(+e.amount||0),0);return[n,got,ret,got-ret]}).filter(r=>r[1]||r[2]);$('reports').innerHTML=`<div class="section">לפי משלם</div>${Object.entries(byP).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="item row"><b>${esc(n)}</b><b>${fmt.format(v)}</b></div>`).join('')}<div class="section">לפי קטגוריה</div>${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="item row"><b>${esc(cm[id]?.name||id)}</b><b>${fmt.format(v)}</b></div>`).join('')}<div class="section">התחשבנות מול משלמים</div>${settle.map(r=>`<div class="item"><b>${esc(r[0])}</b><div class="muted">התקבל: ${fmt.format(r[1])} · הוחזר: ${fmt.format(r[2])}</div><div class="big">פער: ${fmt.format(r[3])}</div></div>`).join('')}`}
function fill(){categoryId.innerHTML=db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');paidBy.innerHTML=['',...db.payers].map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');reimbursementTo.innerHTML=['',...db.payers].map(n=>`<option value="${esc(n)}">${n?'החזר ל: '+esc(n):'ללא'}</option>`).join('');suppliers.innerHTML=[...new Set(db.expenses.map(e=>e.supplier).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}
function openForm(id){fill();const e=id?db.expenses.find(x=>x.id===id):null;mt.textContent=e?'עריכת הוצאה':'הוצאה חדשה';eid.value=e?.id||'';description.value=e?.description||'';amount.value=e?.amount??'';date.value=(e?.date||new Date().toISOString()).slice(0,10);categoryId.value=e?.categoryId||db.categories[0]?.id||'';paidBy.value=e?.paidBy||'';reimbursementTo.value=e?.reimbursementTo||'';supplier.value=e?.supplier||'';paymentMethod.value=e?.paymentMethod||'';notes.value=e?.notes||'';exclude.checked=!!e?.excludeFromTotal;del.classList.toggle('hidden',!e);modal.classList.add('open')}function closeForm(){modal.classList.remove('open')}
function addPayer(){const n=(prompt('שם משלם חדש')||'').trim();if(n&&!db.payers.includes(n)){db.payers.push(n);save();setTimeout(()=>paidBy.value=n)}}function addCat(){const n=(prompt('שם קטגוריה חדשה')||'').trim();if(n){const c={id:'c'+Date.now(),name:n};db.categories.push(c);save();setTimeout(()=>categoryId.value=c.id)}}function addSupplier(){const n=(prompt('שם ספק חדש')||'').trim();if(n)supplier.value=n}
form.onsubmit=e=>{e.preventDefault();const id=eid.value;let x=id?db.expenses.find(z=>z.id===id):{id:'e'+Date.now(),createdAt:new Date().toISOString()};Object.assign(x,{description:description.value.trim(),amount:+amount.value,date:new Date(date.value+'T00:00:00').toISOString(),categoryId:categoryId.value,paidBy:paidBy.value,reimbursementTo:reimbursementTo.value,supplier:supplier.value.trim(),paymentMethod:paymentMethod.value,notes:notes.value.trim(),excludeFromTotal:exclude.checked,updatedAt:new Date().toISOString()});if(!id)db.expenses.unshift(x);closeForm();save()};function delExp(){if(eid.value&&confirm('למחוק?')){db.expenses=db.expenses.filter(e=>e.id!==eid.value);closeForm();save()}}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hotzaot-bniya_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importJSON(file){try{const x=JSON.parse(await file.text());if(!Array.isArray(x.expenses))throw 0;db=x;normalize();await cloudSave();render();alert('הנתונים יובאו ונשמרו בענן')}catch(e){console.error(e);alert('קובץ לא תקין או שהשמירה נכשלה')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.p;render()});document.addEventListener('click',e=>{if(catOpen&&!e.target.closest('.filterbox')){catOpen=false;renderExpenses()}});render();cloudLoad();
</script></body></html>
